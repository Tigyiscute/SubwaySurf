<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers - Tiger Mod</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* The Game Container */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* Glass Circle Button */
        #tiger-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 0, 0, 0.4); /* Starts Red */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
            user-select: none;
            z-index: 999;
        }

        #tiger-btn.active {
            background: rgba(0, 255, 0, 0.6); /* Green when on */
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            transform: scale(1.1);
        }

        #status-text {
            position: fixed;
            bottom: 120px;
            right: 25px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- The Game -->
    <iframe id="game-frame" src="https://ss.randomkzn.com/berlin?mode=original"></iframe>

    <!-- The Controller -->
    <div id="status-text">Tiger Mod: OFF</div>
    <div id="tiger-btn">🐯</div>

    <script>
        const btn = document.getElementById('tiger-btn');
        const status = document.getElementById('status-text');
        const game = document.getElementById('game-frame');
        let spammer = null;
        let isOn = false;

        // Function to simulate the key press
        function sendKey(key) {
            const event = new KeyboardEvent('keydown', {
                key: key,
                code: `Key${key.toUpperCase()}`,
                bubbles: true
            });
            // Attempting to dispatch to the game window
            game.contentWindow.postMessage({type: 'keypress', key: key}, '*'); 
            document.dispatchEvent(event);
        }

        btn.addEventListener('click', () => {
            isOn = !isOn;
            
            if (isOn) {
                btn.classList.add('active');
                status.innerText = "Tiger Mod: ON (Spamming W/D)";
                
                // 250 keys per second = 4ms interval
                spammer = setInterval(() => {
                    sendKey('w');
                    sendKey('d');
                }, 4); 

            } else {
                btn.classList.remove('active');
                status.innerText = "Tiger Mod: OFF";
                clearInterval(spammer);
            }
        });
    </script>
</body>
</html>
