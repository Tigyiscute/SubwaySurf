<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Spectrum Bypass - tavvkkj.squareweb.app</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: monospace;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #111;
            border-radius: 16px;
            border: 1px solid #0f0;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,255,0,0.2);
        }
        .header {
            background: #1a1a1a;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #0f0;
        }
        .logo {
            color: #0f0;
            font-weight: bold;
            font-size: 18px;
        }
        .url-bar {
            flex: 1;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px 12px;
            border-radius: 30px;
            font-family: monospace;
            font-size: 14px;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
        }
        .bypass-methods {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .method-btn {
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }
        .method-btn.active {
            background: #0f0;
            color: #000;
        }
        .iframe-container {
            width: 100%;
            height: 85vh;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .status {
            padding: 8px 16px;
            background: #1a1a1a;
            color: #0f0;
            font-size: 11px;
            font-family: monospace;
            border-top: 1px solid #0f0;
            text-align: center;
        }
        @media (max-width: 700px) {
            .header { flex-direction: column; align-items: stretch; }
            .url-bar { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">🔓 SPECTRUM BYPASS</div>
        <div class="url-bar">
            <input type="text" id="urlInput" value="https://tavvkkj.squareweb.app" placeholder="Enter URL...">
            <button id="goBtn">LOAD</button>
        </div>
        <div class="bypass-methods">
            <div class="method-btn" data-method="iframe">Standard Iframe</div>
            <div class="method-btn" data-method="embed">Embed Src</div>
            <div class="method-btn" data-method="object">Object Tag</div>
            <div class="method-btn" data-method="fetch">Fetch & Inject</div>
        </div>
    </div>
    <div class="iframe-container" id="container">
        <iframe id="targetFrame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation allow-downloads" style="display:none;"></iframe>
    </div>
    <div class="status">
        ⚡ Spectrum WiFi blocks squareweb.app? Use "Fetch & Inject" or "Object Tag" to bypass DNS filtering
    </div>
</div>

<script>
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const container = document.getElementById('container');
    let currentMethod = 'iframe';

    function clearContainer() {
        container.innerHTML = '';
    }

    function loadIframe(url) {
        clearContainer();
        const iframe = document.createElement('iframe');
        iframe.id = 'targetFrame';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.sandbox = 'allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation allow-downloads';
        iframe.src = url;
        container.appendChild(iframe);
    }

    function loadEmbed(url) {
        clearContainer();
        const embed = document.createElement('embed');
        embed.src = url;
        embed.style.width = '100%';
        embed.style.height = '100%';
        container.appendChild(embed);
    }

    function loadObject(url) {
        clearContainer();
        const obj = document.createElement('object');
        obj.data = url;
        obj.type = 'text/html';
        obj.style.width = '100%';
        obj.style.height = '100%';
        container.appendChild(obj);
    }

    async function loadFetchInject(url) {
        clearContainer();
        const div = document.createElement('div');
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.overflow = 'auto';
        div.style.backgroundColor = '#fff';
        div.style.color = '#000';
        div.innerHTML = '<div style="padding:20px; text-align:center; color:#0f0; background:#000;">Loading via fetch + inject...</div>';
        container.appendChild(div);
        try {
            const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
            const response = await fetch(proxyUrl);
            const data = await response.json();
            div.innerHTML = data.contents;
            // rewrite relative links
            const base = document.createElement('base');
            base.href = url;
            div.querySelectorAll('a, link, script').forEach(el => {
                if (el.href && el.href.startsWith('/')) el.href = url + el.href;
            });
        } catch(e) {
            div.innerHTML = `<div style="color:#f00; padding:20px;">Fetch failed: ${e.message}<br>Try "Object Tag" method instead.</div>`;
        }
    }

    function loadUrl() {
        let rawUrl = urlInput.value.trim();
        if (!rawUrl) return;
        if (!rawUrl.startsWith('http')) rawUrl = 'https://' + rawUrl;
        
        switch(currentMethod) {
            case 'iframe':
                loadIframe(rawUrl);
                break;
            case 'embed':
                loadEmbed(rawUrl);
                break;
            case 'object':
                loadObject(rawUrl);
                break;
            case 'fetch':
                loadFetchInject(rawUrl);
                break;
        }
    }

    function setMethod(method) {
        currentMethod = method;
        document.querySelectorAll('.method-btn').forEach(btn => {
            if (btn.getAttribute('data-method') === method) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        loadUrl();
    }

    goBtn.addEventListener('click', loadUrl);
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadUrl();
    });

    document.querySelectorAll('.method-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            setMethod(btn.getAttribute('data-method'));
        });
    });

    // Default load with Object tag (bypasses many ISP filters)
    setMethod('object');
</script>
</body>
</html>
