<!-- Embed The Real Run from squareweb.app into GitHub Pages -->
<!-- Save as index.html in your GitHub repo -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Real Run - Embedded</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
        }
        .iframe-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .fallback {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: #111;
            padding: 20px;
            border-radius: 12px;
            z-index: 999;
        }
        iframe.error + .fallback {
            display: block;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe 
            src="https://tavvkkj.squareweb.app/venice/original" 
            allow="autoplay; fullscreen; clipboard-write; encrypted-media; gamepad; accelerometer; gyroscope"
            allowfullscreen
            loading="eager"
            referrerpolicy="strict-origin-when-cross-origin"
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-presentation allow-downloads"
        ></iframe>
        <div class="fallback">
            <p>Unable to load The Real Run.</p>
            <p><a href="https://tavvkkj.squareweb.app/venice/original" target="_blank" style="color: #fff;">Click here to open directly</a></p>
        </div>
    </div>

    <script>
        const iframe = document.querySelector('iframe');
        const fallback = document.querySelector('.fallback');
        
        iframe.onerror = function() {
            fallback.style.display = 'block';
        };
        
        setTimeout(function() {
            try {
                if (iframe.contentDocument && iframe.contentDocument.readyState !== 'complete') {
                    fallback.style.display = 'block';
                }
            } catch(e) {
                console.log('Iframe loaded (cross-origin)');
            }
        }, 15000);
    </script>
</body>
</html>
