<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers - Custom Remap Workspace</title>
    <style>
        /* Modern Glassmorphism & Matte Black Theme */
        :root {
            --bg-main: #060608;
            --glass-panel: rgba(13, 13, 16, 0.82);
            --glass-border: rgba(255, 255, 255, 0.07);
            --accent-blue: #3b82f6;
            --accent-blue-glow: rgba(59, 130, 246, 0.45);
            --text-main: #f4f4f5;
            --text-muted: #94a3b8;
            --success-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.06), transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--glass-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
        }

        .badge.active {
            background: rgba(16, 185, 129, 0.12);
            border-color: var(--success-green);
            color: var(--success-green);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        /* High-Performance Sandbox Iframe Screen */
        .game-screen {
            position: relative;
            width: 100%;
            height: 560px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        #gameFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Controls Panel Layout */
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Action Mapping State Button */
        .toggle-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .toggle-btn.enabled {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 14px var(--accent-blue-glow);
        }

        /* Config Grid Row */
        .bind-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        @media (max-width: 650px) {
            .bind-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .game-screen {
                height: 420px;
            }
        }

        .bind-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .action-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            color: var(--accent-blue);
            font-family: Menlo, Monaco, Consolas, monospace;
            font-size: 1.05rem;
            font-weight: 700;
            width: 100%;
            padding: 11px 0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }

        .key-btn:hover {
            background: rgba(59, 130, 246, 0.06);
            border-color: var(--accent-blue);
        }

        .key-btn.listening {
            background: rgba(244, 63, 94, 0.1);
            border-color: #f43f5e;
            color: #f43f5e;
            animation: recordPulse 1.2s infinite;
        }

        @keyframes recordPulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="panel">
            <header>
                <h1>Subway Surfers Engine Sandbox</h1>
                <div class="badge" id="statusBadge">Standard Inputs</div>
            </header>

            <div class="game-screen">
                <iframe 
                    src="https://subway-surfers.cc/subway-surfers-games/saint-peterburg" 
                    id="gameFrame"
                    allow="autoplay; fullscreen; keyboard">
                </iframe>
            </div>
        </div>

        <div class="panel">
            <div class="controls-header">
                <span class="panel-title">Custom Input Assignment Profiles</span>
                <button class="toggle-btn" id="toggleBindsBtn">Enable Custom Binds</button>
            </div>

            <div class="bind-grid">
                <div class="bind-box">
                    <span class="action-label">Jump (Up Arrow)</span>
                    <button class="key-btn" id="btn-jump" data-action="jump">W</button>
                </div>
                <div class="bind-box">
                    <span class="action-label">Roll (Down Arrow)</span>
                    <button class="key-btn" id="btn-roll" data-action="roll">S</button>
                </div>
                <div class="bind-box">
                    <span class="action-label">Move Left</span>
                    <button class="key-btn" id="btn-left" data-action="left">A</button>
                </div>
                <div class="bind-box">
                    <span class="action-label">Move Right</span>
                    <button class="key-btn" id="btn-right" data-action="right">D</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let customBindsEnabled = false;
        let activeListeningButton = null;

        // Default layout parameters
        const keyMap = {
            jump: { key: 'w', code: 'KeyW', arrowEquivalent: 'ArrowUp' },
            roll: { key: 's', code: 'KeyS', arrowEquivalent: 'ArrowDown' },
            left: { key: 'a', code: 'KeyA', arrowEquivalent: 'ArrowLeft' },
            right: { key: 'd', code: 'KeyD', arrowEquivalent: 'ArrowRight' }
        };

        const toggleBtn = document.getElementById('toggleBindsBtn');
        const statusBadge = document.getElementById('statusBadge');
        const keyButtons = document.querySelectorAll('.key-btn');
        const gameFrame = document.getElementById('gameFrame');

        // Main Toggle Logic
        toggleBtn.addEventListener('click', () => {
            customBindsEnabled = !customBindsEnabled;
            
            if (customBindsEnabled) {
                toggleBtn.classList.add('enabled');
                toggleBtn.textContent = "Custom Binds Active";
                statusBadge.classList.add('active');
                statusBadge.textContent = "Remap Profiles On";
                // Shift immediate processing focus to the main runner framework window
                gameFrame.focus();
            } else {
                toggleBtn.classList.remove('enabled');
                toggleBtn.textContent = "Enable Custom Binds";
                statusBadge.classList.remove('active');
                statusBadge.textContent = "Standard Inputs";
                
                if (activeListeningButton) {
                    activeListeningButton.classList.remove('listening');
                    activeListeningButton = null;
                }
            }
        });

        // Trigger configuration map state on selector click
        keyButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                if (activeListeningButton) {
                    activeListeningButton.classList.remove('listening');
                }
                activeListeningButton = e.target;
                activeListeningButton.classList.add('listening');
                activeListeningButton.textContent = "...";
            });
        });

        // Global Interception Event Handler Engine
        window.addEventListener('keydown', (e) => {
            // Processing Flow 1: Intercept configuration assign parameters
            if (activeListeningButton) {
                e.preventDefault();
                const action = activeListeningButton.getAttribute('data-action');
                
                keyMap[action].key = e.key.toLowerCase();
                keyMap[action].code = e.code;

                activeListeningButton.textContent = e.key === " " ? "Space" : e.key;
                activeListeningButton.classList.remove('listening');
                activeListeningButton = null;
                return;
            }

            // Processing Flow 2: Dynamic Input Redirect Mapping Execution
            if (customBindsEnabled) {
                const pressedKey = e.key.toLowerCase();
                const pressedCode = e.code;

                for (const action in keyMap) {
                    if (keyMap[action].key === pressedKey || keyMap[action].code === pressedCode) {
                        e.preventDefault();
                        dispatchRedirectedArrow('keydown', keyMap[action].arrowEquivalent);
                        break;
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (customBindsEnabled) {
                const pressedKey = e.key.toLowerCase();
                const pressedCode = e.code;

                for (const action in keyMap) {
                    if (keyMap[action].key === pressedKey || keyMap[action].code === pressedCode) {
                        dispatchRedirectedArrow('keyup', keyMap[action].arrowEquivalent);
                        break;
                    }
                }
            }
        });

        // Frame Injector Factory: Safely routes and dispatches customized key bindings to running environments
        function dispatchRedirectedArrow(type, arrowValue) {
            const properties = {
                key: arrowValue,
                code: arrowValue,
                keyCode: getArrowKeyCode(arrowValue),
                which: getArrowKeyCode(arrowValue),
                bubbles: true,
                cancelable: true
            };

            const simulatedEvent = new KeyboardEvent(type, properties);
            
            // Fires across document layout frames to maintain key injection focus points
            window.dispatchEvent(simulatedEvent);
            if (gameFrame.contentWindow) {
                gameFrame.contentWindow.dispatchEvent(simulatedEvent);
            }
        }

        function getArrowKeyCode(arrowName) {
            switch(arrowName) {
                case 'ArrowLeft': return 37;
                case 'ArrowUp': return 38;
                case 'ArrowRight': return 39;
                case 'ArrowDown': return 40;
                default: return 0;
            }
        }
    </script>
</body>
</html>
