<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tigy Coding | Subway Surfers WASD</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Sleek Glassmorphism Header */
        header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #00f2ff;
            z-index: 100;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="overlay" onclick="setupGame()">
    <h2 style="color: white; border: 2px solid #00f2ff; padding: 20px; border-radius: 10px;">
        CLICK TO ACTIVATE WASD
    </h2>
</div>

<header>
    <b>W/A/S/D Enabled</b> | Houston Edition
</header>

<!-- Using a proxy to bypass 'Refused to Connect' -->
<iframe id="gameFrame" src="https://api.allorigins.win/raw?url=https://yell0wsuit.page/assets/games/subway-surfers-unity/houston.html"></iframe>

<script>
    function setupGame() {
        document.getElementById('overlay').style.display = 'none';
        const frame = document.getElementById('gameFrame');
        frame.focus();
    }

    // This script intercepts WASD and tells the browser they are Arrow Keys
    window.addEventListener("keydown", function(e) {
        const keyMap = {
            'w': 38, // Up
            's': 40, // Down
            'a': 37, // Left
            'd': 39  // Right
        };

        const keyCode = keyMap[e.key.toLowerCase()];
        
        if (keyCode) {
            // Focus the game so it receives the input
            document.getElementById('gameFrame').focus();
            
            // Create a fake Arrow Key event
            const event = new KeyboardEvent('keydown', {
                keyCode: keyCode,
                which: keyCode,
                bubbles: true
            });
            
            // Send it to the frame
            document.dispatchEvent(event);
        }
    }, true);
</script>

</body>
</html>
