<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Speedrun Timer + Subway Surfers (LiveSplit Style)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            font-family: 'Courier New', 'Fira Code', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }
        /* Main container - website fully showing */
        .wrapper {
            width: 100%;
            max-width: 550px;
            background: #000;
            border: 1px solid #00ff00;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        /* Game iframe - full visibility */
        .game-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Skinny timer bar exactly as requested */
        .custom-timer-bar {
            width: 100%;
            background: #000000;
            padding: 8px 16px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            cursor: pointer;
            font-family: Arial, sans-serif;
            border-top: 1px solid #00ff00;
            border-bottom: 1px solid #00ff00;
        }
        .custom-time-text {
            font-weight: 900;
            line-height: 1;
            user-select: none;
            display: flex;
            align-items: baseline;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(to bottom, #ffffff 15%, #7a7a7a 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-main-num {
            font-size: 28px;
        }
        .custom-sub-num {
            font-size: 18px;
            margin-left: 2px;
        }
        /* Hotkey hints */
        .hotkey-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 8px;
            background: #0a0a0a;
            font-size: 11px;
            color: #0f0;
            font-family: monospace;
            border-top: 1px solid #00ff00;
        }
        .hotkey {
            background: #000;
            border: 1px solid #0f0;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .info {
            text-align: center;
            font-size: 9px;
            color: #0a0;
            padding: 6px;
            background: #000;
        }
        @media (max-width: 500px) {
            .custom-main-num { font-size: 22px; }
            .custom-sub-num { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <!-- Game iframe - FULLY SHOWING -->
    <div class="game-container">
        <iframe id="gameFrame" src="https://ss.randomkzn.com/barcelona" allowfullscreen></iframe>
    </div>

    <!-- Timer Bar (exactly as per system) -->
    <div class="custom-timer-bar" id="timerBar">
        <div class="custom-time-text">
            <span class="custom-main-num" id="mainTime">0</span>
            <span class="custom-sub-num" id="subTime">.00</span>
        </div>
    </div>

    <!-- Hotkey bar for reference -->
    <div class="hotkey-bar">
        <span><span class="hotkey">T</span> Start/Pause</span>
        <span><span class="hotkey">Y</span> Reset</span>
        <span><span class="hotkey">Click Timer</span> Start/Pause</span>
    </div>
    <div class="info">
        ⌨️ KEYBINDS ACTIVE | TIMER OVERLAY | FULL GAME VISIBLE
    </div>
</div>

<script>
    // ========== TIMER LOGIC (identical to requested system) ==========
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval = null;
    let isRunning = false;

    const mainDisplay = document.getElementById('mainTime');
    const subDisplay = document.getElementById('subTime');
    const timerBar = document.getElementById('timerBar');

    function startPause() {
        if (!isRunning) {
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(updateTime, 10);
            isRunning = true;
        } else {
            clearInterval(timerInterval);
            elapsedTime = Date.now() - startTime;
            isRunning = false;
        }
    }

    function reset() {
        clearInterval(timerInterval);
        startTime = 0;
        elapsedTime = 0;
        isRunning = false;
        mainDisplay.textContent = '0';
        subDisplay.textContent = '.00';
    }

    function updateTime() {
        elapsedTime = Date.now() - startTime;
        let totalMs = elapsedTime;
        let minutes = Math.floor(totalMs / 60000);
        totalMs %= 60000;
        let seconds = Math.floor(totalMs / 1000);
        let milliseconds = Math.floor((totalMs % 1000) / 10);

        if (minutes > 0) {
            mainDisplay.textContent = `${minutes}:${String(seconds).padStart(2, '0')}`;
        } else {
            mainDisplay.textContent = String(seconds);
        }
        subDisplay.textContent = `.${String(milliseconds).padStart(2, '0')}`;
    }

    // Global key listeners (T = start/pause, Y = reset)
    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        // Don't trigger if typing into an input
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
        if (key === 't') {
            e.preventDefault();
            startPause();
        }
        if (key === 'y') {
            e.preventDefault();
            reset();
        }
    }, true);

    // Click on timer bar also toggles
    timerBar.addEventListener('click', startPause);

    // Optional: Ensure iframe doesn't steal focus from keybinds
    const iframe = document.getElementById('gameFrame');
    iframe.addEventListener('load', () => {
        // keep focus on body to capture keys
        document.body.focus();
    });
    // click on wrapper focuses body
    document.body.addEventListener('click', () => {
        document.body.focus();
    });
</script>
</body>
</html>
