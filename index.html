    <script>
        const speedInput = document.getElementById('speed-controller');
        const speedDisplay = document.getElementById('speed-display');

        function modifyEngineSpeed(scale) {
            // Target the loaded unity game instance handler directly if compiled hooks match
            if (window.unityInstance && window.unityInstance.SendMessage) {
                try {
                    window.unityInstance.SendMessage('TimeScaleController', 'SetTimeScale', scale);
                } catch(e) {

                }
            }
        }

        speedInput.addEventListener('input', (event) => {
            const multiplier = parseFloat(event.target.value).toFixed(1);

            modifyEngineSpeed(multiplier);
        });
