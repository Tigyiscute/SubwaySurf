<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tigy Coding | Monaco Matrix Mod</title>
    <style>
        /* Smooth Black Premium Base */
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #09090b;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            user-select: none;
        }

        /* Ambient blue-to-green gradient backdrop glow */
        .glow-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 15% 15%, rgba(0, 242, 255, 0.15), transparent 45%),
                        radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.12), transparent 50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Premium Black Glassmorphism Mod Control Panel Dashboard */
        #mod-dashboard {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 18, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 242, 255, 0.25);
            padding: 12px 30px;
            border-radius: 50px;
            z-index: 100;
            display: flex;
            gap: 25px;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #00f2ff;
        }

        /* Custom Neon Hack Slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.08);
            height: 6px;
            border-radius: 50px;
            outline: none;
            width: 110px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00f2ff;
            cursor: pointer;
            box-shadow: 0 0 10px #00f2ff;
        }

        .multiplier-display {
            font-family: monospace;
            color: #00ff88;
            min-width: 35px;
        }

        /* Neon Tiger Toggle Button */
        .tiger-toggle-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tiger-toggle-btn.macro-active {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        .game-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            position: relative;
            z-index: 2;
            background: transparent;
        }

        /* Interaction Entry Gate */
        #focus-gate {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.92);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .glass-card {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 45px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        .action-btn {
            background: linear-gradient(90deg, #00f2ff, #00ff88);
            color: #000;
            padding: 16px 40px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.25rem;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="glow-overlay"></div>

<div id="focus-gate" onclick="startEngine()">
    <div class="glass-card">
        <h1 style="color: #fff; margin: 0 0 8px 0; font-size: 2.2rem; letter-spacing: -0.5px;">SUBWAY SURFERS</h1>
        <p style="color: #00ff88; margin: 0 0 35px 0; font-weight: 600; font-size: 0.9rem; letter-spacing: 1px;">🐯 SPEED INJECTOR PRO</p>
        <button class="action-btn">LAUNCH HUB</button>
    </div>
</div>

<div id="mod-dashboard">
    <button id="tigerBtn" class="tiger-toggle-btn" onclick="toggleTigerHack()">
        <span>🐯</span> Tiger Mode: <span id="statusText" style="font-weight:900;">OFF</span>
    </button>
    
    <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.15);"></div>
    
    <div class="control-group">
        <label for="hackInterval">Hack Clock:</label>
        <input type="range" id="hackInterval" min="1" max="10" step="1" value="5" oninput="adjustHackFrequency(this.value)">
        <span id="hzDisplay" class="multiplier-display">5x</span>
    </div>
</div>

<iframe id="gameViewport" class="game-frame" src="https://subwaysurferscity.io/subway-surfers-monaco.embed" scrolling="none"></iframe>

<script>
    let hackIntervalId = null;
    let isHackRunning = false;
    let switchSide = false;
    let systemPulseRate = 50; // Milliseconds per cycle block

    function startEngine() {
        document.getElementById('focus-gate').style.display = 'none';
        document.getElementById('gameViewport').focus();
    }

    function adjustHackFrequency(val) {
        // Maps the slider multiplier directly into execution speeds
        systemPulseRate = Math.round(250 / parseInt(val));
        document.getElementById('hzDisplay').innerText = val + 'x';
        
        // Live recycle if thread is currently spinning
        if (isHackRunning) {
            stopThreadLoop();
            startThreadLoop();
        }
    }

    function toggleTigerHack() {
        isHackRunning = !isHackRunning;
        const btn = document.getElementById('tigerBtn');
        const statusText = document.getElementById('statusText');

        if (isHackRunning) {
            btn.classList.add('macro-active');
            statusText.innerText = "ON";
            startThreadLoop();
        } else {
            btn.classList.remove('macro-active');
            statusText.innerText = "OFF";
            stopThreadLoop();
        }
        document.getElementById('gameViewport').focus();
    }

    function startThreadLoop() {
        const frameWindow = document.getElementById('gameViewport').contentWindow;
        
        hackIntervalId = setInterval(() => {
            // Emulates shifting variables back and forth rapidly to trick execution states
            let targetVector = switchSide ? 37 : 39;
            switchSide = !switchSide;

            try {
                // Injects simulated hardware states down into the iframe environment window
                frameWindow.postMessage({ type: 'keydown', keyCode: targetVector }, '*');
                frameWindow.postMessage({ type: 'keypress', keyCode: targetVector }, '*');
            } catch (err) {}

            // Global root layout thread fallback force injection
            const corePulseEvent = new KeyboardEvent('keydown', {
                keyCode: targetVector,
                which: targetVector,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(corePulseEvent);
        }, systemPulseRate);
    }

    function stopThreadLoop() {
        if (hackIntervalId) {
            clearInterval(hackIntervalId);
            hackIntervalId = null;
        }
    }

    // Capture standard control mappings cleanly
    window.addEventListener("keydown", function(e) {
        const keyStroke = e.key.toLowerCase();
        
        // Q Toggles the Entire Injector Process Loop
        if (keyStroke === 'q') {
            e.preventDefault();
            toggleTigerHack();
            return;
        }

        // Keep core hardware WASD inputs translated cleanly down into standard navigation vectors
        let virtualKeyCode;
        if (keyStroke === 'w') virtualKeyCode = 38; // Up
        if (keyStroke === 's') virtualKeyCode = 40; // Down
        if (keyStroke === 'a') virtualKeyCode = 37; // Left
        if (keyStroke === 'd') virtualKeyCode = 39; // Right

        if (virtualKeyCode) {
            e.preventDefault();
            const destinationFrame = document.getElementById('gameViewport').contentWindow;
            try {
                destinationFrame.postMessage({ type: 'keydown', keyCode: virtualKeyCode }, '*');
            } catch (err) {}

            const trackingEvent = new KeyboardEvent('keydown', {
                keyCode: virtualKeyCode,
                which: virtualKeyCode,
                bubbles: true
            });
            document.dispatchEvent(trackingEvent);
        }
    }, true);
</script>

</body>
</html>
