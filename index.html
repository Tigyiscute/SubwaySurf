<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 2px solid #ccc;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <iframe id="target-iframe" src="https://www.tavvkkj.xyz/venice/original"></iframe>

    <br>

    <button id="action-btn">A And D</button>

    <script>
        document.getElementById('action-btn').addEventListener('click', () => {
            const iframe = document.getElementById('target-iframe');
            
            try {
                // Target the window inside the iframe
                const iframeWindow = iframe.contentWindow;

                // Create and dispatch the 'A' keydown event
                const eventA = new KeyboardEvent('keydown', { key: 'a', code: 'KeyA', bubbles: true });
                iframeWindow.dispatchEvent(eventA);

                // Create and dispatch the 'D' keydown event
                const eventD = new KeyboardEvent('keydown', { key: 'd', code: 'KeyD', bubbles: true });
                iframeWindow.dispatchEvent(eventD);
                
                console.log("Keys 'A' and 'D' dispatched.");
            } catch (error) {
                console.error("Security Blocked: Cannot access cross-origin iframe.", error);
                alert("Cross-Origin Security Restriction: Browsers do not allow sending keystrokes to an external website iframe.");
            }
        });
    </script>

</body>
</html>
