<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers | TAS Edition</title>
    <style>
        :root {
            --bg: #050505;
            --glass: rgba(15, 15, 15, 0.9);
            --blue: #0088ff; /* Your favorite color */
            --text: #e0e0e0;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
        }

        /* Black Glass Header */
        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 136, 255, 0.3);
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--blue);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 136, 255, 0.5);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .speed-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            padding: 5px 15px;
            border-radius: 20px;
        }

        input[type=range] {
            cursor: pointer;
            accent-color: var(--blue);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--blue);
            color: var(--blue);
            padding: 7px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--blue);
            color: white;
            box-shadow: 0 0 15px var(--blue);
        }

        /* Game Wrapper */
        #container {
            width: 100%;
            height: calc(100vh - 60px);
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Subway Surf TAS</div>
        
        <div class="controls">
            <div class="speed-box">
                <span>Speed: <b id="val">1.0</b>x</span>
                <input type="range" id="slider" min="0.1" max="2.5" step="0.1" value="1">
            </div>
            <button class="btn" onclick="toggleFS()">FULLSCREEN</button>
        </div>
    </header>

    <div id="container">
        <!-- The Game -->
        <iframe id="game" src="https://ss.randomkzn.com/berlin?mode=original"></iframe>
    </div>

    <script>
        const game = document.getElementById('game');
        const slider = document.getElementById('slider');
        const speedText = document.getElementById('val');

        // TASK: Inject Speed Control
        // This attempts to bypass the origin restriction by talking to the video elements first
        function updateSpeed(s) {
            const speed = parseFloat(s);
            speedText.innerText = speed.toFixed(1);
            
            try {
                // If the game uses HTML5 Video for animations (uncommon for SS but possible)
                const videos = game.contentWindow.document.querySelectorAll('video');
                videos.forEach(v => v.playbackRate = speed);
            } catch(e) {
                console.log("Standard speed hack blocked by CORS. Using fallback...");
            }
        }

        slider.oninput = (e) => updateSpeed(e.target.value);

        function toggleFS() {
            const elem = document.getElementById('container');
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        }

        // Auto-focus the game so you don't have to click it to start moving
        window.onload = () => {
            game.focus();
        };
    </script>
</body>
</html>
