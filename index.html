<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tigy Coding | Subway Surfers Monaco</title>
    <style>
        /* Smooth black base */
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #09090b;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Ambient blue-to-green gradient background glow */
        .glow-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 15% 15%, rgba(0, 242, 255, 0.15), transparent 45%),
                        radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.12), transparent 50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Black Glassmorphism Header Panel */
        header {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 18, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 242, 255, 0.25);
            padding: 10px 30px;
            border-radius: 50px;
            color: #00f2ff;
            z-index: 100;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .status-dot {
            width: 8px; height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff88;
        }

        .game-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            position: relative;
            z-index: 2;
            background: transparent;
        }

        /* Focus Capture Gate */
        #focus-gate {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.9);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .glass-card {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 45px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            max-width: 380px;
        }

        .action-btn {
            background: linear-gradient(90deg, #00f2ff, #00ff88);
            color: #000;
            padding: 16px 40px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.25rem;
            border: none;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover .action-btn {
            transform: scale(1.04);
            box-shadow: 0 0 35px rgba(0, 242, 255, 0.5);
        }

        .caption {
            color: #71717a; margin-top: 18px; font-size: 0.85rem; line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="glow-overlay"></div>

<div id="focus-gate" onclick="startEngine()">
    <div class="glass-card">
        <h1 style="color: #fff; margin: 0 0 8px 0; font-size: 2.2rem; letter-spacing: -0.5px;">SUBWAY SURFERS</h1>
        <p style="color: #00ff88; margin: 0 0 35px 0; font-weight: 600; font-size: 0.9rem; letter-spacing: 1px;">MONACO EDITION</p>
        <button class="action-btn">LAUNCH GAME</button>
        <p class="caption">Clicking locks input focus, pinning your WASD keys directly to the live game embed window.</p>
    </div>
</div>

<header>
    <div class="status-dot"></div>
    <span style="font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px;">WASD CONFIGURATION INJECTED</span>
</header>

<iframe id="gameContainer" class="game-frame" src="https://subwaysurferscity.io/subway-surfers-monaco.embed" scrolling="none"></iframe>

<script>
    function startEngine() {
        document.getElementById('focus-gate').style.display = 'none';
        const frame = document.getElementById('gameContainer');
        frame.focus();
    }

    // Intercept WASD presses on parent layer and route them as Arrow Events
    window.addEventListener("keydown", function(e) {
        const inputKey = e.key.toLowerCase();
        let targetKeyCode;

        if (inputKey === 'w') targetKeyCode = 38; // Up
        if (inputKey === 's') targetKeyCode = 40; // Down
        if (inputKey === 'a') targetKeyCode = 37; // Left
        if (inputKey === 'd') targetKeyCode = 39; // Right

        if (targetKeyCode) {
            e.preventDefault(); // Prevents layout shifting during runs

            const innerFrame = document.getElementById('gameContainer').contentWindow;

            // Direct content window broadcast channel
            try {
                innerFrame.postMessage({ type: 'keydown', keyCode: targetKeyCode }, '*');
            } catch (err) {}

            // Create and distribute a perfect local browser KeyboardEvent 
            const directEvent = new KeyboardEvent('keydown', {
                keyCode: targetKeyCode,
                which: targetKeyCode,
                code: targetKeyCode === 38 ? 'ArrowUp' : targetKeyCode === 40 ? 'ArrowDown' : targetKeyCode === 37 ? 'ArrowLeft' : 'ArrowRight',
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(directEvent);
        }
    }, true);
</script>

</body>
</html>
