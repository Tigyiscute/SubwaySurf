<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tigy Coding | Subway Surfers</title>
    <style>
        /* Sleek smooth black base */
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Vibrant blue-to-green gradient glow background */
        .gradient-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(0, 242, 255, 0.15), transparent 45%),
                        radial-gradient(circle at bottom right, rgba(0, 255, 136, 0.12), transparent 50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Black Glassmorphism Header */
        header {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 242, 255, 0.25);
            padding: 12px 35px;
            border-radius: 50px;
            color: #00f2ff;
            z-index: 100;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .live-dot {
            width: 8px; height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
        }

        .game-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            position: relative;
            z-index: 2;
        }

        /* Interactive Click-to-Play Glass Overlay */
        #input-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.85);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .play-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        .play-btn {
            background: linear-gradient(90deg, #00f2ff, #00ff88);
            color: #000;
            padding: 16px 45px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.3rem;
            border: none;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .play-card:hover .play-btn {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.6);
        }

        .hint {
            color: #888; margin-top: 15px; font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="gradient-bg"></div>

<div id="input-overlay" onclick="initGame()">
    <div class="play-card">
        <h1 style="color: #fff; margin: 0 0 10px 0; font-size: 2rem;">SUBWAY SURFERS</h1>
        <p style="color: #00ff88; margin: 0 0 30px 0; font-weight: 600;">CUSTOM WASD ENGINE</p>
        <button class="play-btn">READY TO RUN</button>
        <p class="hint">Clicking binds W, A, S, D directly to the engine</p>
    </div>
</div>

<header>
    <div class="live-dot"></div>
    <span style="font-size: 0.85rem; font-weight: bold; letter-spacing: 1px;">WASD FORCED</span>
</header>

<iframe id="surferFrame" class="game-frame" src="https://images-opensocial.googleusercontent.com/gadgets/ifr?url=https://cdn.jsdelivr.net/gh/sk1project/sk1-wx@main/subway.xml"></iframe>

<script>
    function initGame() {
        document.getElementById('input-overlay').style.display = 'none';
        const game = document.getElementById('surferFrame');
        game.focus();
    }

    // Hardware-level event redirector for WASD -> Arrows
    window.addEventListener("keydown", function(e) {
        const key = e.key.toLowerCase();
        let targetCode;

        if (key === 'w') targetCode = 38; // Up Arrow
        if (key === 's') targetCode = 40; // Down Arrow
        if (key === 'a') targetCode = 37; // Left Arrow
        if (key === 'd') targetCode = 39; // Right Arrow

        if (targetCode) {
            e.preventDefault(); // Stop window space/arrow shifting
            
            const gameWindow = document.getElementById('surferFrame').contentWindow;
            
            // Dispatch a native KeyboardEvent right past the cross-origin boundary
            const eventData = { keyCode: targetCode, which: targetCode, bubbles: true };
            gameWindow.postMessage({ type: 'keydown', data: eventData }, '*');
            
            // Local fallback trigger
            const nativeEvent = new KeyboardEvent('keydown', {
                keyCode: targetCode,
                which: targetCode,
                bubbles: true
            });
            document.dispatchEvent(nativeEvent);
        }
    }, true);
</script>

</body>
</html>
