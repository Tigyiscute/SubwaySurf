<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subway Surfers - Record & Speed</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        iframe { width: 100vw; height: 100vh; border: none; z-index: 1; }

        #tiger-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: rgba(255, 50, 50, 0.4); /* Default Red */
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* State Styles */
        #tiger-btn.recording { background: rgba(255, 165, 0, 0.6); animation: pulse 1s infinite; }
        #tiger-btn.active { background: rgba(50, 255, 50, 0.6); }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #hint {
            position: fixed;
            bottom: 140px;
            right: 40px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div id="hint">Status: Idle</div>
    <div id="tiger-btn">🐯</div>
    <iframe id="game" src="https://ss.randomkzn.com/berlin?mode=original"></iframe>

    <script>
        const btn = document.getElementById('tiger-btn');
        const hint = document.getElementById('hint');
        const game = document.getElementById('game');
        
        let state = 'idle'; // idle, recording, active
        let recordedPath = [];
        let playbackInterval = null;

        // Capture movement during recording
        window.addEventListener('mousedown', (e) => {
            if (state === 'recording') {
                recordedPath = [];
                recordedPath.push({ x: e.clientX, y: e.clientY, type: 'pointerdown' });
                
                const moveHandler = (moveEv) => {
                    recordedPath.push({ x: moveEv.clientX, y: moveEv.clientY, type: 'pointermove' });
                };
                
                const upHandler = (upEv) => {
                    recordedPath.push({ x: upEv.clientX, y: upEv.clientY, type: 'pointerup' });
                    window.removeEventListener('mousemove', moveHandler);
                    window.removeEventListener('mouseup', upHandler);
                    hint.innerText = "Captured! Click Tiger to Start Spam";
                };

                window.addEventListener('mousemove', moveHandler);
                window.addEventListener('mouseup', upHandler);
            }
        });

        function playBack() {
            if (recordedPath.length === 0) return;
            
            recordedPath.forEach((point) => {
                const ev = new PointerEvent(point.type, {
                    clientX: point.x,
                    clientY: point.y,
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                // Send to the main document and try to proxy to iframe
                document.dispatchEvent(ev);
                game.contentWindow.dispatchEvent(ev); 
            });
        }

        btn.addEventListener('click', () => {
            if (state === 'idle') {
                state = 'recording';
                btn.className = 'recording';
                hint.innerText = "Action: Swipe ONCE on the game";
            } 
            else if (state === 'recording') {
                state = 'active';
                btn.className = 'active';
                hint.innerText = "Tiger Mod: ACTIVE (Spamming)";
                // Run at 250Hz (approx 4ms)
                playbackInterval = setInterval(playBack, 4);
            } 
            else {
                state = 'idle';
                btn.className = '';
                hint.innerText = "Status: Idle";
                clearInterval(playbackInterval);
            }
        });
    </script>
</body>
</html>
