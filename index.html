<!DOCTYPE html>
<html>
<head>
    <title>Subway Surfers - Tiger Q-Toggle</title>
    <style>
        body, html { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; }
        
        #tiger {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ff4444; /* Red */
            border: 4px solid rgba(255,255,255,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            z-index: 9999;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            user-select: none;
        }

        #tiger.enabled {
            background: #44ff44; /* Green */
            box-shadow: 0 0 25px #44ff44;
            transform: scale(1.1);
        }

        #hint {
            position: fixed;
            bottom: 120px;
            right: 30px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="hint">Press <b>Q</b> or Click Tiger</div>
<div id="tiger">🐯</div>
<iframe id="game" src="https://ss.randomkzn.com/berlin?mode=original"></iframe>

<script>
    const tiger = document.getElementById('tiger');
    let active = false;
    let timer = null;

    function send(k) {
        const e = new KeyboardEvent('keydown', {
            key: k,
            keyCode: k === 'w' ? 87 : 68,
            code: k === 'w' ? 'KeyW' : 'KeyD',
            which: k === 'w' ? 87 : 68,
            bubbles: true
        });
        document.dispatchEvent(e);
        window.dispatchEvent(e);
        // Dispatch to iframe just in case
        const frame = document.getElementById('game');
        frame.contentWindow.postMessage('trigger-input', '*'); 
    }

    function toggle() {
        active = !active;
        if (active) {
            tiger.classList.add('enabled');
            timer = setInterval(() => {
                send('w');
                send('d');
            }, 4); // 250 keys per second
        } else {
            tiger.classList.remove('enabled');
            clearInterval(timer);
        }
    }

    // Click trigger
    tiger.onclick = toggle;

    // "Q" Key trigger
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'q') {
            toggle();
        }
    });
</script>

</body>
</html>
