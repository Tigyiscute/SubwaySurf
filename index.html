<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subway Surfers - Keyboard Tiger</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* Glass Circle Button */
        #tiger-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.4); /* Start Red */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
            z-index: 1000;
        }

        #tiger-btn.active {
            background: rgba(0, 255, 0, 0.6); /* Green when active */
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
            transform: scale(1.1);
        }

        #label {
            position: fixed;
            bottom: 120px;
            right: 30px;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="label">TIGER: OFF</div>
    <div id="tiger-btn">🐯</div>
    <iframe id="game-frame" src="https://ss.randomkzn.com/berlin?mode=original"></iframe>

    <script>
        const btn = document.getElementById('tiger-btn');
        const label = document.getElementById('label');
        const game = document.getElementById('game-frame');
        
        let active = false;
        let spamTimer = null;

        // Function to create a keyboard event
        function pressKey(keyCode, char) {
            const eventData = {
                key: char,
                code: keyCode,
                keyCode: char.toUpperCase().charCodeAt(0),
                which: char.toUpperCase().charCodeAt(0),
                bubbles: true,
                cancelable: true
            };

            const down = new KeyboardEvent('keydown', eventData);
            const up = new KeyboardEvent('keyup', eventData);

            // Dispatch to both the main window and the game window
            window.dispatchEvent(down);
            game.contentWindow.dispatchEvent(down);
            
            // Release immediately to allow the next spam cycle
            setTimeout(() => {
                window.dispatchEvent(up);
                game.contentWindow.dispatchEvent(up);
            }, 1);
        }

        btn.addEventListener('click', () => {
            active = !active;

            if (active) {
                btn.classList.add('active');
                label.innerText = "TIGER: SPAMMING";
                label.style.color = "#00ff00";

                // Interval set to 4ms (1000ms / 4 = 250 times per second)
                spamTimer = setInterval(() => {
                    pressKey('KeyW', 'w');
                    pressKey('KeyD', 'd');
                }, 4);

            } else {
                btn.classList.remove('active');
                label.innerText = "TIGER: OFF";
                label.style.color = "white";
                clearInterval(spamTimer);
            }
        });
    </script>
</body>
</html>
