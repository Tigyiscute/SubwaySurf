<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tigy Coding | Native Speed Hack Port</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #09090b;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            user-select: none;
        }

        /* Ambient blue-to-green gradient backdrop glow */
        .glow-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 15% 15%, rgba(0, 242, 255, 0.15), transparent 45%),
                        radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.12), transparent 50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Black Glassmorphic Mod Menu Control Dashboard */
        #mod-dashboard {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 18, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 242, 255, 0.25);
            padding: 12px 30px;
            border-radius: 50px;
            z-index: 100;
            display: flex;
            gap: 25px;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #00f2ff;
        }

        /* Neon Speed Slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.08);
            height: 6px;
            border-radius: 50px;
            outline: none;
            width: 120px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(90deg, #00f2ff, #00ff88);
            cursor: pointer;
            box-shadow: 0 0 10px #00ff88;
        }

        .multiplier-display {
            font-family: monospace;
            color: #00ff88;
            min-width: 35px;
            font-weight: bold;
        }

        .tiger-toggle-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .tiger-toggle-btn.macro-active {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 5;
        }
    </style>
</head>
<body>

<div class="glow-overlay"></div>

<div id="mod-dashboard">
    <button id="tigerBtn" class="tiger-toggle-btn" onclick="toggleTigerHack()">
        <span>🐯</span> Tiger Mode: <span id="statusText" style="font-weight:900;">OFF</span>
    </button>
    
    <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.15);"></div>
    
    <div class="control-group">
        <label for="speedSlider">SPEED MULTIPLIER:</label>
        <input type="range" id="speedSlider" min="0.5" max="5.0" step="0.1" value="1.0" oninput="injectSpeedHack(this.value)">
        <span id="multiplierValue" class="multiplier-display">1.0x</span>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeViewport() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeViewport);
    resizeViewport();

    // SPEED HACK CORE CORE VARIABLE
    let speedHackMultiplier = 1.0;
    let isTigerRunning = false;
    let tigerTimer = 0;

    function injectSpeedHack(val) {
        speedHackMultiplier = parseFloat(val);
        document.getElementById('multiplierValue').innerText = val + 'x';
    }

    function toggleTigerHack() {
        isTigerRunning = !isTigerRunning;
        document.getElementById('tigerBtn').classList.toggle('macro-active', isTigerRunning);
        document.getElementById('statusText').innerText = isTigerRunning ? "ON" : "OFF";
    }

    // Engine Configurations
    const player = {
        x: 0, y: 0, width: 44, height: 65,
        lane: 1, targetX: 0,
        jumping: false, velocity: 0, gravity: 0.6
    };

    const tracks = {
        getLaneX: function(lane) {
            const step = canvas.width / 4;
            return (canvas.width / 2) - step + (lane * step) - (player.width / 2);
        }
    };
    player.x = tracks.getLaneX(player.lane);
    player.targetX = player.x;

    let obstacles = [];
    let baseSpeed = 6.5; 
    let gameScore = 0;
    let hazardSpawnTimer = 0;

    // Standard Keyboard Route Mapping (WASD Supported natively)
    window.addEventListener('keydown', function(e) {
        const key = e.key.toLowerCase();
        
        if (key === 'q') {
            toggleTigerHack();
            return;
        }
        if ((key === 'a' || e.key === 'ArrowLeft') && player.lane > 0) {
            player.lane--;
            player.targetX = tracks.getLaneX(player.lane);
        }
        if ((key === 'd' || e.key === 'ArrowRight') && player.lane < 2) {
            player.lane++;
            player.targetX = tracks.getLaneX(player.lane);
        }
        if ((key === 'w' || e.key === ' ' || e.key === 'ArrowUp') && !player.jumping) {
            player.jumping = true;
            player.velocity = -14.5;
        }
    });

    function spawnObstacle() {
        const lane = Math.floor(Math.random() * 3);
        obstacles.push({
            x: tracks.getLaneX(lane) + (player.width - 42) / 2,
            y: -80, width: 42, height: 45, lane: lane
        });
    }

    // CORE NATIVE RUNTIME MATRIX LOOP
    function engineTick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // SPEED HACK APPLIED DIRECTLY HERE TO RUNTIME PHYSICS
        let frameVelocity = baseSpeed * speedHackMultiplier;

        // Draw Tracks
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.15)';
        ctx.lineWidth = 3;
        for(let i = 0; i < 3; i++) {
            ctx.onprefix = true;
            ctx.beginPath();
            ctx.moveTo((canvas.width / 2) - (canvas.width / 4) + (i * (canvas.width / 4)), 0);
            ctx.lineTo((canvas.width / 2) - (canvas.width / 4) + (i * (canvas.width / 4)), canvas.height);
            ctx.stroke();
        }

        // Interpolate lateral movement smoothly
        player.x += (player.targetX - player.x) * 0.25;

        // Process vertical translation calculations
        if (player.jumping) {
            player.y += player.velocity * speedHackMultiplier; // Jump matches speed hack velocity
            player.velocity += player.gravity * speedHackMultiplier;
            if (player.y >= 0) {
                player.y = 0;
                player.jumping = false;
            }
        }

        // Render Character Mesh
        ctx.fillStyle = '#00f2ff';
        ctx.shadowColor = '#00f2ff';
        ctx.shadowBlur = 15;
        const playerY = (canvas.height * 0.8) + player.y;
        ctx.fillRect(player.x, playerY, player.width, player.height);
        ctx.shadowBlur = 0;

        // Process Tiger Auto Pilot Module
        if (isTigerRunning) {
            tigerTimer += speedHackMultiplier;
            if (tigerTimer > 35) {
                player.lane = player.lane === 1 ? (Math.random() > 0.5 ? 0 : 2) : 1;
                player.targetX = tracks.getLaneX(player.lane);
                tigerTimer = 0;
            }
        }

        // Obstacle Vector Generation Thread
        hazardSpawnTimer += speedHackMultiplier;
        if (hazardSpawnTimer > 80) {
            spawnObstacle();
            hazardSpawnTimer = 0;
        }

        // Process active canvas arrays
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.y += frameVelocity; // Injected Speed Multiplier

            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 10;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.shadowBlur = 0;

            // Clear frame bounds and score tracking points
            if (obs.y > canvas.height) {
                obstacles.splice(i, 1);
                gameScore += Math.round(10 * speedHackMultiplier);
                continue;
            }

            // Real-time block contact checks
            if (obs.lane === player.lane && !player.jumping && obs.y + obs.height >= playerY && obs.y <= playerY + player.height) {
                gameScore = 0;
                obstacles = [];
                break;
            }
        }

        // Draw HUD Layout
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px monospace';
        ctx.fillText(`SCORE: ${gameScore}`, 40, 50);

        requestAnimationFrame(engineTick);
    }

    engineTick();
</script>

</body>
</html>
