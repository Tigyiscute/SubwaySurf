<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LiveSplit Style Timer + Subway Surfers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #000000;
            font-family: 'Courier New', 'Fira Code', 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 8px;
        }
        /* LiveSplit classic look: black background, neon green monospace */
        .livesplit-container {
            max-width: 550px;
            width: 100%;
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 0 1px #00ff00, 0 0 0 3px #000000;
        }
        /* Game area with 16:9 aspect */
        .game-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-bottom: 2px solid #00ff00;
        }
        .game-frame {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        /* LiveSplit Timer Panel - exact style */
        .timer-panel {
            background: #000000;
            padding: 12px 16px;
            border-bottom: 1px solid #00ff00;
        }
        .timer-display {
            text-align: center;
            font-size: 56px;
            font-weight: 900;
            font-family: 'Courier New', 'Fira Code', monospace;
            letter-spacing: 4px;
            color: #00ff00;
            background: #000000;
            text-shadow: 0 0 2px #00ff00;
            word-break: break-word;
            line-height: 1.2;
        }
        .split-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
            color: #00aa00;
            font-family: monospace;
            border-top: 1px dashed #00ff0033;
            padding-top: 8px;
        }
        /* LiveSplit style buttons */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            padding: 12px 16px;
            background: #000000;
            border-bottom: 1px solid #00ff00;
        }
        .ls-button {
            background: #000000;
            border: 1.5px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            padding: 8px 20px;
            border-radius: 0px;
            cursor: pointer;
            transition: all 0.05s linear;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .ls-button:active {
            background: #00ff00;
            color: #000000;
            transform: scale(0.97);
        }
        /* Hotkey bar */
        .hotkey-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 10px 16px;
            background: #000000;
            font-size: 12px;
            font-family: monospace;
            color: #00aa00;
            border-top: 1px solid #00ff00;
        }
        .hotkey {
            background: #0a0a0a;
            padding: 4px 10px;
            border: 1px solid #00ff00;
            font-weight: bold;
            color: #00ff00;
            font-size: 11px;
        }
        .info-text {
            text-align: center;
            font-size: 9px;
            color: #008800;
            padding: 8px;
            background: #000;
            font-family: monospace;
        }
        @media (max-width: 600px) {
            .timer-display { font-size: 42px; letter-spacing: 2px; }
            .ls-button { padding: 6px 14px; font-size: 12px; }
            .hotkey-bar { gap: 12px; flex-wrap: wrap; }
        }
        /* LiveSplit "splits" simulation */
        .segment {
            font-size: 10px;
            color: #00aa00;
            background: #050505;
            padding: 2px 6px;
        }
    </style>
</head>
<body>
<div class="livesplit-container">
    <!-- Game iframe -->
    <div class="game-wrapper">
        <div class="game-frame">
            <iframe id="gameIframe" src="https://ss.randomkzn.com/barcelona" allowfullscreen></iframe>
        </div>
    </div>

    <!-- LiveSplit Timer -->
    <div class="timer-panel">
        <div class="timer-display" id="timerDisplay">00:00.00</div>
        <div class="split-info">
            <span>▶ CURRENT SEGMENT</span>
            <span>🏆 SUBWAY SURFERS</span>
        </div>
    </div>

    <!-- Controls matching LiveSplit theme -->
    <div class="controls">
        <button class="ls-button" id="startSplitBtn">▶ START</button>
        <button class="ls-button" id="pauseSplitBtn">⏸ PAUSE</button>
        <button class="ls-button" id="resetSplitBtn">⟳ RESET</button>
    </div>

    <!-- Hotkey bar like Livesplit's key hints -->
    <div class="hotkey-bar">
        <span><span class="hotkey">T</span> Start / Pause</span>
        <span><span class="hotkey">R</span> Reset Timer</span>
        <span><span class="hotkey">F5</span> Reload Game</span>
    </div>
    <div class="info-text">
        ⌨️ KEYBINDS ACTIVE | LIVESPLIT STYLE | MOBILE FRIENDLY
    </div>
</div>

<script>
    // ========== LIVESPLIT STYLE TIMER ==========
    let timerRunning = false;
    let startTime = 0;
    let accumulatedTime = 0;
    let timerInterval = null;
    const timerDisplay = document.getElementById('timerDisplay');
    const startBtn = document.getElementById('startSplitBtn');
    const pauseBtn = document.getElementById('pauseSplitBtn');
    const resetBtn = document.getElementById('resetSplitBtn');

    // Format as MM:SS.cc (LiveSplit typical)
    function formatTime(ms) {
        let totalSeconds = Math.floor(ms / 1000);
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;
        let centiseconds = Math.floor((ms % 1000) / 10);
        return `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}.${centiseconds.toString().padStart(2,'0')}`;
    }

    function updateTimerDisplay() {
        if (timerRunning) {
            const now = Date.now();
            const elapsed = accumulatedTime + (now - startTime);
            timerDisplay.textContent = formatTime(elapsed);
        } else {
            timerDisplay.textContent = formatTime(accumulatedTime);
        }
    }

    function timerTick() {
        if (timerRunning) {
            const now = Date.now();
            const elapsed = accumulatedTime + (now - startTime);
            timerDisplay.textContent = formatTime(elapsed);
        }
    }

    function startTimer() {
        if (timerRunning) return;
        timerRunning = true;
        startTime = Date.now();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(timerTick, 10);
    }

    function pauseTimer() {
        if (!timerRunning) return;
        const now = Date.now();
        accumulatedTime += (now - startTime);
        timerRunning = false;
        updateTimerDisplay();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
    }

    function resetTimer() {
        const wasRunning = timerRunning;
        if (wasRunning) pauseTimer();
        accumulatedTime = 0;
        timerRunning = false;
        updateTimerDisplay();
        if (wasRunning) startTimer();
        else updateTimerDisplay();
    }

    // Button events
    startBtn.addEventListener('click', () => {
        if (timerRunning) pauseTimer();
        else startTimer();
    });
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    // Keyboard shortcuts (LiveSplit style)
    window.addEventListener('keydown', (e) => {
        const key = e.key.toUpperCase();
        // T -> Start/Pause toggle
        if (key === 'T') {
            e.preventDefault();
            if (timerRunning) pauseTimer();
            else startTimer();
        }
        // R -> Reset
        else if (key === 'R') {
            e.preventDefault();
            resetTimer();
        }
        // F5 or Ctrl+R -> Reload game with confirmation
        else if (key === 'F5' || (e.ctrlKey && key === 'R')) {
            e.preventDefault();
            if (confirm('⟳ Reload Subway Surfers? Timer will reset.')) {
                resetTimer();
                const iframe = document.getElementById('gameIframe');
                iframe.src = iframe.src;
            }
        }
    });

    // Prevent touch context menu on long press for mobile
    document.querySelectorAll('.ls-button').forEach(btn => {
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
    });
</script>
</body>
</html>
