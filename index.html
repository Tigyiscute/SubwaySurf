<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Portal - Beijing</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <style>
        :root { --y: #FFD700; --bg: #000; }
        body { margin: 0; background: var(--bg); color: var(--y); font-family: 'Bungee', cursive; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        header { width: 100%; padding: 15px; text-align: center; border-bottom: 2px solid var(--y); background: #111; }
        .game-area { position: relative; width: 95vw; height: 75vh; margin-top: 20px; border: 2px solid #333; border-radius: 10px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; z-index: 5; }
        .play-btn { background: var(--y); border: none; padding: 15px 45px; font-family: 'Bungee'; font-size: 1.4rem; cursor: pointer; border-radius: 5px; box-shadow: 0 5px 0 #b89b00; }
        .play-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b89b00; }
        .fs-btn { margin-top: 15px; background: #222; color: #fff; border: 1px solid #444; padding: 10px 25px; cursor: pointer; border-radius: 5px; font-family: sans-serif; }
    </style>
</head>
<body>

    <header>SUBWAY RUNNER: BEIJING</header>

    <div class="game-area" id="box">
        <div class="overlay" id="pre">
            <button class="play-btn" onclick="hardBypass()">BOOT SYSTEM</button>
            <p style="margin-top: 10px; font-family: sans-serif; font-size: 0.8rem; color: #666;">(Local Injection Mode)</p>
        </div>
        <iframe id="game" allowfullscreen allow="autoplay; fullscreen; keyboard-map"></iframe>
    </div>

    <button class="fs-btn" onclick="full()">FULLSCREEN</button>

    <script>
        function hardBypass() {
            const frame = document.getElementById('game');
            const pre = document.getElementById('pre');
            
            // This is the Vercel link encoded so the firewall can't read it
            const target = "https://surfmap-run.vercel.app/beijing";
            
            // We use a Google Proxy to wrap the Vercel traffic.
            // Schools rarely block Google's internal gadget proxy.
            const proxy = "https://images-opensocial.googleusercontent.com/gadgets/proxy?container=ig&url=";
            
            frame.src = proxy + encodeURIComponent(target);
            
            frame.style.display = "block";
            pre.style.display = "none";
        }

        function full() {
            const el = document.getElementById('box');
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }
    </script>
</body>
</html>
