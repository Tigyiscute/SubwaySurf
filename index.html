<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers - Houston</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 15px 25px;
            background: #1f1f1f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls-hint {
            font-size: 0.9rem;
            color: #aaa;
        }

        .game-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Overlay to catch focus */
        #focus-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 5;
            transition: opacity 0.3s;
        }

        #focus-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .btn-play {
            padding: 15px 40px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-play:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Subway Surfers: Houston</div>
    <div class="controls-hint">Use <b>WASD</b> or <b>ARROWS</b> to Play</div>
</header>

<div class="game-container">
    <div id="focus-overlay">
        <button class="btn-play" onclick="startGame()">CLICK TO PLAY</button>
    </div>
    <iframe 
        id="game-frame" 
        src="https://yell0wsuit.page/assets/games/subway-surfers-unity/houston.html"
        allow="autoplay; fullscreen"
    ></iframe>
</div>

<script>
    const iframe = document.getElementById('game-frame');
    const overlay = document.getElementById('focus-overlay');

    function startGame() {
        overlay.classList.add('hidden');
        iframe.focus();
    }

    // Re-bind WASD to Arrow Keys via Event Dispatching
    // Note: This works if the iframe is on the same domain. 
    // Since it's cross-domain, we listen on the parent and 
    // remind the user if they lose focus.
    window.addEventListener('keydown', function(e) {
        const key = e.key.toLowerCase();
        
        // If user is pressing WASD on the parent page, 
        // they likely need to click the game again.
        if (['w', 'a', 's', 'd'].includes(key)) {
            console.log("WASD pressed on parent. Ensure iframe is focused.");
            iframe.focus();
        }
    });

    // Auto-focus logic
    window.addEventListener('blur', () => {
        // Optional: logic to detect if the user left the game
    });
</script>

</body>
</html>
