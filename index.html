<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers | Zurich</title>
    <style>
        /* Modern Gaming Aesthetic */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        /* The Game Box */
        #gameContainer {
            position: relative;
            width: 90%;
            max-width: 1100px;
            height: 70vh;
            background: #000;
            border: 4px solid #333;
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Fullscreen Button Styling */
        .ui-area {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #fullscreen-btn {
            padding: 15px 35px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            color: #000;
            background-color: #ffcc00;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #b38f00;
        }

        #fullscreen-btn:hover {
            background-color: #ffe066;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #b38f00;
        }

        #fullscreen-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b38f00;
        }

        .hint {
            color: #666;
            font-size: 0.85rem;
        }

        /* Fullscreen specific behavior */
        #gameContainer:fullscreen {
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Subway Surfers | Zurich</h1>
    </header>

    <!-- Wrap the iframe in a container for better fullscreen control -->
    <div id="gameContainer">
        <iframe 
            id="subwayFrame"
            src="https://ss.randomkzn.com/zurich?mode=original" 
            allow="fullscreen"
            title="Subway Surfers Zurich Edition">
        </iframe>
    </div>

    <div class="ui-area">
        <button id="fullscreen-btn">✨ Play Fullscreen</button>
        <div class="hint">Use Arrow Keys to Jump, Roll, and Dodge!</div>
    </div>

    <script>
        const container = document.getElementById('gameContainer');
        const btn = document.getElementById('fullscreen-btn');

        btn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                // Open Fullscreen
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) { /* Safari */
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) { /* IE11 */
                    container.msRequestFullscreen();
                }
                btn.textContent = "Exit Fullscreen";
            } else {
                // Exit Fullscreen
                document.exitFullscreen();
                btn.textContent = "✨ Play Fullscreen";
            }
        });

        // Listen for the 'Esc' key to update button text
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                btn.textContent = "✨ Play Fullscreen";
            }
        });
    </script>

</body>
</html>
