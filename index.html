<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Runner - Beijing Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --p-y: #FFD700; --bg: #121212; --white: #ffffff; }
        body { margin: 0; padding: 0; font-family: 'Roboto', sans-serif; background-color: var(--bg); color: var(--white); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        header { width: 100%; padding: 15px 0; text-align: center; border-bottom: 3px solid var(--p-y); background: #1a1a1a; }
        h1 { font-family: 'Bungee', cursive; margin: 0; color: var(--p-y); font-size: 1.8rem; }

        .game-container {
            width: 95%;
            max-width: 1000px;
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-wrapper { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 2px solid #333;
        }

        #game-frame { width: 100%; height: 100%; border: none; display: none; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #333 0%, #000 100%); z-index: 10; }

        .btn { background: var(--p-y); border: none; padding: 18px 45px; font-family: 'Bungee', cursive; font-size: 1.4rem; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 0 #b89b00; }
        .btn:hover { transform: scale(1.05); background: #ffea00; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b89b00; }

        /* Full Screen Button Styling */
        .controls {
            margin-top: 15px;
            display: none; /* Hidden until game starts */
            width: 100%;
            justify-content: center;
        }

        .fs-btn {
            background: #444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .fs-btn:hover { background: #666; }
    </style>
</head>
<body>

    <header>
        <h1>Subway Runner: Beijing Edition</h1>
    </header>

    <div class="game-container">
        <div class="game-wrapper" id="gameBox">
            <div class="overlay" id="ov">
                <button class="btn" onclick="run()">INITIALIZE RUN</button>
            </div>
            <iframe id="game-frame" src="" allowfullscreen allow="fullscreen"></iframe>
        </div>

        <div class="controls" id="controlBar">
            <button class="fs-btn" onclick="toggleFullScreen()">
                <svg width="20" height="20" fill="white" viewBox="0 0 16 16">
                    <path d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z"/>
                </svg>
                FULLSCREEN
            </button>
        </div>
    </div>

    <script>
        function run() {
            const f = document.getElementById('game-frame');
            const o = document.getElementById('ov');
            const c = document.getElementById('controlBar');
            
            // Mirror source
            f.src = "https://subwaysurfersgame.github.io/beijing/";
            
            f.style.display = "block";
            o.style.display = "none";
            c.style.display = "flex";
        }

        function toggleFullScreen() {
            const gameBox = document.getElementById('gameBox');
            
            if (!document.fullscreenElement) {
                // Request full screen on the wrapper so the whole game fills the monitor
                if (gameBox.requestFullscreen) {
                    gameBox.requestFullscreen();
                } else if (gameBox.webkitRequestFullscreen) { /* Safari */
                    gameBox.webkitRequestFullscreen();
                } else if (gameBox.msRequestFullscreen) { /* IE11 */
                    gameBox.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
