<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Runner - Beijing Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <style>
        :root { --y: #FFD700; --bg: #111; }
        body { margin: 0; background: var(--bg); color: var(--y); font-family: 'Bungee', cursive; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; padding: 20px; text-align: center; border-bottom: 3px solid var(--y); background: #1a1a1a; }
        .container { width: 95%; max-width: 1000px; margin-top: 30px; }
        .game-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; border: 3px solid #333; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; z-index: 5; }
        .play-btn { background: var(--y); border: none; padding: 20px 60px; font-family: 'Bungee'; font-size: 1.8rem; cursor: pointer; border-radius: 10px; box-shadow: 0 6px 0 #b89b00; transition: 0.1s; }
        .play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b89b00; }
        .controls { margin-top: 15px; display: none; }
        .fs-btn { background: #333; color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header>SUBWAY RUNNER: BEIJING</header>

    <div class="container">
        <div class="game-box" id="gameArea">
            <div class="overlay" id="preloader">
                <button class="play-btn" onclick="bypassLaunch()">PLAY NOW</button>
            </div>
            <iframe id="gameFrame" allowfullscreen allow="autoplay; fullscreen; keyboard-map"></iframe>
        </div>

        <center>
            <div class="controls" id="ui">
                <button class="fs-btn" onclick="goFull()">FULLSCREEN</button>
            </div>
        </center>
    </div>

    <script>
        function bypassLaunch() {
            const frame = document.getElementById('gameFrame');
            const loader = document.getElementById('preloader');
            const ui = document.getElementById('ui');

            // BYPASS LOGIC: Instead of a direct Vercel link, we use a proxy link.
            // If the Vercel link is the ONLY one blocked, we use a mirrored 
            // version of that same site hosted on a different platform.
            
            const gameUrl = "https://subwaysurfersgame.github.io/beijing/";
            
            frame.src = gameUrl;
            frame.style.display = "block";
            loader.style.display = "none";
            ui.style.display = "block";
        }

        function goFull() {
            const area = document.getElementById('gameArea');
            if (area.requestFullscreen) area.requestFullscreen();
            else if (area.webkitRequestFullscreen) area.webkitRequestFullscreen();
        }
    </script>
</body>
</html>
