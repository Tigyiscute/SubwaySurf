<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers | Houston Edition</title>
    <style>
        :root {
            --primary: #ffcc00;
            --bg: #0f0f0f;
            --surface: #1e1e1e;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
        }

        h1 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        p { color: #aaa; margin-bottom: 2rem; }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
            background: #121212;
            padding: 1rem;
            border-radius: 12px;
        }

        .key {
            background: #333;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: bold;
            color: var(--primary);
        }

        .btn-launch {
            background: var(--primary);
            color: black;
            text-decoration: none;
            padding: 1.2rem 2rem;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.1rem;
            display: inline-block;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-launch:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 204, 0, 0.3);
        }

        .tip {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Houston Surfers</h1>
        <p>The Unity Port</p>

        <div class="controls">
            <div><span class="key">W / A / S / D</span><br><small>Movement</small></div>
            <div><span class="key">SPACE</span><br><small>Hoverboard</small></div>
        </div>

        <button onclick="launchGame()" class="btn-launch">PLAY NOW</button>
        
        <div class="tip">
            Note: WASD binds are active by default in this version.
        </div>
    </div>

<script>
    function launchGame() {
        // This opens the game in a new "popup" style window without toolbars
        const url = "https://yell0wsuit.page/assets/games/subway-surfers-unity/houston.html";
        const width = 900;
        const height = 600;
        const left = (screen.width / 2) - (width / 2);
        const top = (screen.height / 2) - (height / 2);
        
        window.open(url, "SubwaySurfers", 
            `width=${width},height=${height},top=${top},left=${left},menubar=no,toolbar=no,location=no,status=no`);
    }
</script>

</body>
</html>
