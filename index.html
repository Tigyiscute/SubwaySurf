<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers | TAS Edition</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --glass-bg: rgba(20, 20, 20, 0.85);
            --accent: #ffcc00; /* Dark Gold */
            --text: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        /* Black Glass Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 204, 0, 0.2);
            z-index: 10;
            position: relative;
        }

        .title {
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Custom Slider Styling */
        .speed-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        input[type=range] {
            cursor: pointer;
            accent-color: var(--accent);
        }

        /* Buttons */
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }

        .btn:hover {
            background: var(--accent);
            color: #000;
        }

        /* Game Area */
        #game-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .fs-mode {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">Subway Surf for TAS</div>
        
        <div class="controls">
            <div class="speed-container">
                <span>Speed: <b id="speedVal">1.0</b>x</span>
                <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1">
            </div>
            
            <button class="btn" onclick="toggleFullScreen()">Fullscreen</button>
        </div>
    </header>

    <div id="game-container">
        <iframe id="gameFrame" src="https://ss.randomkzn.com/berlin?mode=original"></iframe>
    </div>

    <script>
        const frame = document.getElementById('gameFrame');
        const slider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');

        // Update display text
        slider.oninput = function() {
            const val = this.value;
            speedVal.innerText = val;
            applySpeed(val);
        };

        function applySpeed(multiplier) {
            // Since you are on a Chromebook, we attempt to inject 
            // the speed multiplier into the iframe context.
            try {
                const win = frame.contentWindow;
                
                // Method 1: Change all video/audio playback rates
                const media = win.document.querySelectorAll('video, audio');
                media.forEach(m => m.playbackRate = multiplier);

                // Method 2: Global Clock Hack
                // Note: Some browsers block this cross-origin, 
                // but this works if the domain allows it.
                if (win.eval) {
                    win.eval(`window.speedMultiplier = ${multiplier};`);
                }
            } catch (e) {
                console.log("Cross-origin restrictions may prevent speed hacking on this specific domain.");
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
